<script id="calc">
/* ===== 集計エンジン（DOM非依存・nodeでテスト可能） ===== */
const YOY=(function(){
  function fyOf(d){ return d.getMonth()>=3? d.getFullYear() : d.getFullYear()-1; }           // 会計年度（4月開始）
  function fyIdx(m){ return m>=4? m-4 : m+8; }                                              // 4月=0 … 3月=11
  function norm(s){ return String(s||"").replace(/株式会社|（株）|\(株\)|有限会社|（有）|\(有\)|[\s　]/g,""); }
  function parseD(v){ if(!v) return null; const t=new Date(v); return isNaN(t)?null:t; }
  /** 期間: fy=今期の会計年度, endIdx=終了月の索引(0=4月…11=3月) */
  function ranges(fy,endIdx){
    const endM=endIdx+4>12? endIdx-8 : endIdx+4;            // 暦月
    const endY=endIdx>=9? fy+1 : fy;
    const cur=[new Date(fy,3,1), new Date(endY,endM,0,23,59,59)];        // 月末
    const prev=[new Date(fy-1,3,1), new Date(endY-1,endM,0,23,59,59)];
    return {cur,prev,endM};
  }
  function inR(d,r){ return d && d>=r[0] && d<=r[1]; }
  function num(v){ return Number(String(v==null?"":v).replace(/[^0-9.\-]/g,""))||0; }

  /** 市売: 精算台帳 rows {market,date,kind,sales,net} */
  function aggIchiba(ledger,R){
    const m={};
    for(const x of ledger||[]){ const d=parseD(x.date); if(!d) continue;
      const k=String(x.market||"").trim()||"(市場不明)";
      const o=m[k]=m[k]||{name:k,ch:"市売",p:0,c:0,first:null,last:null};
      if(!o.first||d<o.first) o.first=d; if(!o.last||d>o.last) o.last=d;
      if(inR(d,R.cur)) o.c+=num(x.sales); else if(inR(d,R.prev)) o.p+=num(x.sales);
    }
    // 前期カバレッジ: 台帳の最古日が前期開始より後なら「前期データ不足」
    for(const o of Object.values(m)){ o.cov = o.first && o.first<=R.prev[0] ? "ok" : (o.first && o.first<=R.prev[1] ? "part" : "none"); }
    return Object.values(m);
  }
  /** 法人らしさの判定（個人名＝単発客はまとめて1行にする） */
  const CO_RE=/株|㈱|㈲|有限|（有）|\(有\)|合同|会社|木材|モクザイ|建設|建装|工務|工業|産業|商店|商事|住宅|ハウス|ハウジング|工房|建築|設計|不動産|組合|市場|センター|製作所|事業|銘建|林業|製材|板金|塗装|内装|美装|リフォーム|工芸|建材|物産|興業|企業|技工|営業所|建営|サービス|デンキ|電気|電機|ケンソウ|ケンセツ|コウギョウ|コウムテン|ホーム|プランニング|店$|社$|組$|園$|堂$|屋$|舎$|館$/;
  function isCompany(raw){ return CO_RE.test(String(raw||"")); }   // ※normで（株）等を落とす前の生の名前で判定する
  const INDIV="個人客（単発）", INDIV_CO="単発法人（HP直販）", REPEAT_MIN=3;   // HP直販の法人は注文日が3日未満なら単発扱い（本人指示 2026-09-03）
  /** 名寄せ・取引先メモ（memo.json を boot 時に読み込む。alias: norm後の表記ゆれ→正の名前 / memo: キー=norm後の名前） */
  let ALIAS={}, MEMO={};
  function setMemo(j){ ALIAS=(j&&j.alias)||{}; MEMO=(j&&j.memo)||{}; }
  function memoOf(k){ return MEMO[k]||null; }
  /** 付売・HP直販: 納品書DB rows {date,customer,method,kingaku} */
  function aggNouhin(rows,R){
    const m={}, days={};
    for(const r of rows||[]){ if(String(r.method||"").trim()!=="ネット") continue; let k=norm(r.customer); k=ALIAS[k]||k; (days[k]=days[k]||new Set()).add(String(r.date||"").slice(0,10)); }   // HP直販の注文日数（全期間）
    for(const r of rows||[]){ const meth=String(r.method||"").trim(); if(meth==="市売") continue;
      const d=parseD(r.date); if(!d) continue;
      const ch = meth==="ネット" ? "HP直販" : (meth||"付売");
      let k=norm(r.customer)||"(取引先不明)"; k=ALIAS[k]||k;
      let indiv=false;
      if(ch!=="付売"){ if(!isCompany(r.customer)){ indiv=true; k=INDIV; } else if((days[k]||new Set()).size<REPEAT_MIN){ indiv=true; k=INDIV_CO; } }   // 付売は法人取引先のみ・表記ゆれは名寄せ
      const key=ch+"|"+k;
      const o=m[key]=m[key]||{name:k,ch,p:0,c:0,first:null,last:null,cov:"ok",indiv,names:{}};
      if(indiv){ const n=norm(r.customer); if(n) o.names[n]=(o.names[n]||0)+num(r.kingaku); }
      if(!o.first||d<o.first) o.first=d; if(!o.last||d>o.last) o.last=d;
      if(inR(d,R.cur)) o.c+=num(r.kingaku); else if(inR(d,R.prev)) o.p+=num(r.kingaku);
    }
    return Object.values(m).filter(o=>o.p||o.c);
  }
  /** EC: ecv = {rakuten:{fy:[{month,sheet}]},yahoo:{...}} */
  function aggEC(ecv,fy,endIdx){
    const out=[]; const names={rakuten:"楽天市場",yahoo:"ヤフーショッピング"};
    for(const mall of Object.keys(ecv||{})){
      const o={name:names[mall]||mall,ch:"EC",p:0,c:0,cov:"ok",last:null,months:{}};
      for(const y of [fy-1,fy]){ for(const mo of (ecv[mall]&&ecv[mall][y])||[]){ const idx=fyIdx(+mo.month); if(idx>endIdx) continue;
        const v=num(mo.sheet); if(y===fy) o.c+=v; else o.p+=v; o.months[y+"-"+mo.month]=v; } }
      if(!(ecv[mall]&&ecv[mall][fy-1]&&ecv[mall][fy-1].length)) o.cov="none";
      out.push(o);
    }
    return out;
  }
  function build(data,fy,endIdx){
    const R=ranges(fy,endIdx);
    const rows=[].concat(aggIchiba(data.ledger,R), aggNouhin(data.nouhin,R), aggEC(data.ec,fy,endIdx));
    rows.forEach(o=>{ o.d=o.c-o.p; o.rate = o.p? o.c/o.p : null; o.memo=o.indiv?null:memoOf(o.name); o.isNew = !o.indiv && !o.p && o.c>0 && (!o.first || o.first>=R.cur[0]); });   // 新規＝前期ゼロかつ初回取引が今期内（前々期以前に買っていた先は「戻り」で新規に数えない）
    const ch={}; for(const o of rows){ const c=ch[o.ch]=ch[o.ch]||{ch:o.ch,p:0,c:0,cp:0,cc:0,noCov:0,n:0,nP:0,nC:0,lost:0,neu:0}; c.p+=o.p; c.c+=o.c;
      if(!o.indiv){ c.n++; if(o.p) c.nP++; if(o.c) c.nC++; if(o.p&&!o.c) c.lost++; if(o.isNew) c.neu++; }   // 単発の個人客は取引先数・消えた・新規に数えない
      if(o.cov==="ok"){ c.cp+=o.p; c.cc+=o.c; } else c.noCov++; }   // cp/cc=前期データが揃っている先だけの合計（比較可能分）
    const tot={p:0,c:0,cp:0,cc:0,noCov:0}; Object.values(ch).forEach(c=>{tot.p+=c.p; tot.c+=c.c; tot.cp+=c.cp; tot.cc+=c.cc; tot.noCov+=c.noCov;});
    return {R,rows,ch:Object.values(ch),tot};
  }
  return {fyOf,fyIdx,ranges,build,norm,isCompany,setMemo,INDIV_CO,alias:()=>ALIAS,memo:()=>MEMO};
})();
if(typeof module!=="undefined") module.exports=YOY;
</script>

<script>
/* ===== 設定 ===== */
const KEIEI_URL="https://script.google.com/macros/s/AKfycbw4wRp48Y0B89JWbNB8nBOmybtvz4xztYWHoWTVlqX3mNFTZzdfPoaQHqvC5yQaIGxU/exec"; // 経営日報API（login＝認証＋精算台帳）
const NOUHIN_URL="https://script.google.com/macros/s/AKfycbyE2O2zEk1NDYskaxflVtPReblSOyA5CyjfHTNXAYzK6tX1zgEzRypcFFSjtDy2SWa7wg/exec"; // 納品書DB
// 納品書DBの読取はログイン中のSSOパスで通す（2026-09-09 合言葉の直書きを廃止）
const EC_URL="https://script.google.com/macros/s/AKfycbwxyn-27FkDO0glFdHwqiN6NiXG5vY0rZXOAfBMDMnh2aSBHO9KxqQRThOZb7W8hAT6/exec"; // order-desk（ec_verify）
const CRED_KEY="uriageyoy_cred", CACHE_KEY="uriageyoy_cache_v1", END_KEY="uriageyoy_end";

/* ===== 資格情報（共通SSO: h02050d-ship-it.github.io の他ツールのログインを引き継ぐ）===== */
const SSO_KEY="hayazai_sso_cred";
const SSO_PEERS=["hayazai_board_cred","hayazai_seiso_cred","hayazai_rulebook_cred","hayazai_kaizen_cred","notify_creds_v1","seinodesk_cred","faxdesk_cred","orderdesk_cred","nippou_cred","ryoshu_cred","hacchu_cred","shikin_cred"];
function ssoFind_(){ for(const k of [SSO_KEY].concat(SSO_PEERS)){ try{ const v=JSON.parse(localStorage.getItem(k)||"null"); if(v){ const email=v.email||v.e, pass=v.pass||v.p; if(email&&pass) return {email:String(email),pass:String(pass)}; } }catch(e){} } return null; }
function ssoWrite(email,pass){ try{ localStorage.setItem(SSO_KEY,JSON.stringify({email,pass})); }catch(e){} }
function ssoClear(){ try{ localStorage.removeItem(SSO_KEY); }catch(e){} }
function creds(){ try{ const v=JSON.parse(localStorage.getItem(CRED_KEY)||"null"); if(v&&v.email&&v.pass) return v; }catch(e){} const s=ssoFind_(); if(s){ try{ localStorage.setItem(CRED_KEY,JSON.stringify(s)); }catch(e){} return s; } return {}; }
function saveCreds(email,pass){ try{ localStorage.setItem(CRED_KEY,JSON.stringify({email,pass})); }catch(e){} ssoWrite(email,pass); }
function clearCreds(){ try{ localStorage.removeItem(CRED_KEY); localStorage.removeItem(CACHE_KEY); }catch(e){} ssoClear(); }

/* ===== ユーティリティ ===== */
const $=id=>document.getElementById(id);
function esc(s){ return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function man(n,dash){ const v=Math.round((n||0)/10000); if(!v&&dash) return "-"; return (v<0?"▲":"")+Math.abs(v).toLocaleString("ja-JP"); }
function man1(n){ const v=Math.round((n||0)/1000)/10; return (v<0?"▲":"")+Math.abs(v).toLocaleString("ja-JP",{minimumFractionDigits:1,maximumFractionDigits:1}); }
function mu(n,dash){ const t=man(n,dash); return t==="-"?t:t+"<span class='u'>万</span>"; }   // 単位つき（表のセル用）
function pct(r){ return r==null? "-" : Math.round(r*100)+"%"; }
function ymd(d){ return d? (d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()) : "-"; }
let toastT=null; function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); }
async function postJ(url,payload){ const r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}); return await r.json(); }
async function getJ(url){ const r=await fetch(url); return await r.json(); }

/* ===== 状態 ===== */
let DATA=null;       // {ledger,nouhin,ec,fetchedAt}
let RES=null;        // YOY.build の結果
let FY=YOY.fyOf(new Date());
let ENDIDX=null;     // 終了月の索引（既定=前月）
let FILTER="all", CH="all", SORT={k:"d",asc:true}, Q="";

function defaultEndIdx(){ const now=new Date(); const prevM=new Date(now.getFullYear(),now.getMonth(),0); const idx=YOY.fyIdx(prevM.getMonth()+1); return YOY.fyOf(prevM)<FY ? 0 : idx; }

/* ===== 起動（前回データ即表示 → 裏で最新取得） ===== */
const INDIV_CO=YOY.INDIV_CO; const MEMO_KEY="uriageyoy_memo_v1";
async function loadMemo(){
  try{ YOY.setMemo(JSON.parse(localStorage.getItem(MEMO_KEY)||"null")); }catch(e){}
  try{ const r=await fetch("memo.json?ts="+Date.now(),{cache:"no-store"}); if(r.ok){ const j=await r.json(); YOY.setMemo(j); localStorage.setItem(MEMO_KEY,JSON.stringify(j)); } }catch(e){}
}
async function boot(){
  const c=creds(); if(!(c.email&&c.pass)){ showGate(); return; }
  await loadMemo();
  $("gate").classList.remove("on"); $("app").style.display="";
  const saved=+localStorage.getItem(END_KEY); ENDIDX = (saved>=0&&saved<=11&&localStorage.getItem(END_KEY)!==null) ? saved : defaultEndIdx();
  buildEndSel();
  let cache=null; try{ cache=JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); }catch(e){}
  if(cache&&cache.ledger){ DATA=cache; render(); $("meta").textContent="前回取得分を表示中（最新を取得しています…）"; }
  fetchAll();
}
function showGate(err){ $("app").style.display="none"; $("gate").classList.add("on"); $("gErr").textContent=err||""; setTimeout(()=>$("gMail").focus(),50); }
$("gBtn").onclick=async()=>{
  const email=$("gMail").value.trim().toLowerCase(), pass=$("gPass").value;
  if(!email||!pass){ $("gErr").textContent="メールとパスワードを入力してください"; return; }
  $("gErr").textContent="確認中…";
  try{ const d=await postJ(KEIEI_URL,{action:"login",email,pass});
    if(d&&d.ok){ saveCreds(email,pass); $("gErr").textContent=""; boot(); }
    else if(d&&d.error==="auth") $("gErr").textContent="メールまたはパスワードが違います";
    else $("gErr").textContent="エラー: "+(d&&d.error||"不明");
  }catch(e){ $("gErr").textContent="接続エラー。通信環境を確認してください"; }
};
["gMail","gPass"].forEach(id=>$(id).addEventListener("keydown",e=>{ if(e.key==="Enter") $("gBtn").click(); }));
$("logoutBtn").onclick=()=>{ clearCreds(); location.reload(); };
$("reloadBtn").onclick=()=>fetchAll();

async function fetchAll(){
  const c=creds(); if(!c.email) return;
  $("meta").textContent="最新を取得しています…";
  try{
    const [login,nouhin,r1,r0,y1,y0]=await Promise.all([
      postJ(KEIEI_URL,{action:"login",email:c.email,pass:c.pass}),
      getJ(NOUHIN_URL+"?action=getRecords&pass="+encodeURIComponent((creds()||{}).pass||"")),
      getJ(EC_URL+"?action=ec_verify&mall=rakuten&fy="+FY+"&email="+encodeURIComponent(c.email)+"&pass="+encodeURIComponent(c.pass)),
      getJ(EC_URL+"?action=ec_verify&mall=rakuten&fy="+(FY-1)+"&email="+encodeURIComponent(c.email)+"&pass="+encodeURIComponent(c.pass)),
      getJ(EC_URL+"?action=ec_verify&mall=yahoo&fy="+FY+"&email="+encodeURIComponent(c.email)+"&pass="+encodeURIComponent(c.pass)),
      getJ(EC_URL+"?action=ec_verify&mall=yahoo&fy="+(FY-1)+"&email="+encodeURIComponent(c.email)+"&pass="+encodeURIComponent(c.pass)),
    ]);
    if(!(login&&login.ok)){ if(login&&login.error==="auth"){ clearCreds(); showGate("ログインの有効期限が切れました。もう一度ログインしてください"); } else { $("meta").textContent="取得エラー: "+(login&&login.error||"不明"); } return; }
    const rows=Array.isArray(nouhin)?nouhin:(nouhin.rows||nouhin.records||nouhin.data||[]);
    const slim=rows.map(r=>({date:r.date,customer:r.customer,method:r.method,kingaku:r.kingaku}));
    DATA={ledger:login.ichiba||[], nouhin:slim, ec:{rakuten:{[FY]:(r1.months||[]),[FY-1]:(r0.months||[])}, yahoo:{[FY]:(y1.months||[]),[FY-1]:(y0.months||[])}}, fetchedAt:Date.now()};
    try{ localStorage.setItem(CACHE_KEY,JSON.stringify(DATA)); }catch(e){}
    render(); toast("最新を取得しました");
  }catch(e){ console.error(e); $("meta").textContent=(DATA?"通信エラー・前回データを表示中":"取得エラー。再読込してください"); }
}

/* ===== 描画 ===== */
function buildEndSel(){
  const s=$("endSel"); s.innerHTML="";
  for(let i=0;i<12;i++){ const m=i+4>12?i-8:i+4; const o=document.createElement("option"); o.value=i; o.textContent=m+"月まで"; s.appendChild(o); }
  s.value=ENDIDX;
  s.onchange=()=>{ ENDIDX=+s.value; localStorage.setItem(END_KEY,ENDIDX); render(); };
}
function render(){
  if(!DATA) return;
  RES=YOY.build(DATA,FY,ENDIDX);
  const R=RES.R; const endM=R.endM;
  $("period").textContent=FY+"年度 4月〜"+endM+"月 vs 前年同期";
  const t=DATA.fetchedAt?new Date(DATA.fetchedAt):null;
  $("meta").textContent="データ取得: "+(t?t.toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"-")+" ／ 今期 "+ymd(R.cur[0])+"〜"+ymd(R.cur[1])+" ／ 前期 "+ymd(R.prev[0])+"〜"+ymd(R.prev[1]);
  renderKpis(); renderCh(); renderChips(); renderTable(); renderNotes();
}
function cls(n){ return n<0?"neg":(n>0?"pos":""); }
function renderKpis(){
  const T=RES.tot; const chs={}; RES.ch.forEach(c=>chs[c.ch]=c);
  const line=(p,c,noCov)=>{ const d=c-p; return "前期 "+man(p)+"万 → 差 <b class='"+cls(d)+"'>"+man(d)+"万</b>（"+pct(p?c/p:null)+"）"+(noCov?"<br><span class='tag t-warn'>前期データのない"+noCov+"先を除く</span>":""); };
  const k=[{l:"合計（比較可能な先のみ）",v:man(T.cc)+"万",s:line(T.cp,T.cc,T.noCov)}];
  for(const name of ["市売","付売","EC","HP直販"]){ const c=chs[name]; if(!c) continue; k.push({l:name+(c.noCov?"（比較可能分）":""),v:man(c.cc)+"万",s:line(c.cp,c.cc,c.noCov)}); }
  $("kpis").innerHTML=k.map(x=>"<div class='kpi'><div class='l'>"+esc(x.l)+"</div><div class='v'>"+x.v+"</div><div class='s'>"+x.s+"</div></div>").join("");
}
function renderCh(){
  const T=RES.tot; const dT=T.c-T.p;
  const order=["市売","付売","EC","HP直販"]; const rows=RES.ch.slice().sort((a,b)=>order.indexOf(a.ch)-order.indexOf(b.ch));
  const dC=T.cc-T.cp;
  let h="<tr><th>チャネル</th><th class='r'>前期</th><th class='r'>今期</th><th class='r'>差</th><th class='r'>前年比</th><th class='r'>全体の差への寄与</th><th class='r'>取引先数（前期→今期）</th><th class='r'>消えた</th><th class='r'>新規</th></tr>";
  for(const c of rows){ const d=c.c-c.p; const dd=c.cc-c.cp;
    h+="<tr><td>"+tag(c.ch)+(c.noCov?" <span class='tag t-warn'>前期データなし "+c.noCov+"先を含む</span>":"")+"</td><td class='r'>"+mu(c.p)+"</td><td class='r'>"+mu(c.c)+"</td><td class='r "+cls(d)+"'>"+mu(d)+"</td><td class='r'>"+pct(c.p?c.c/c.p:null)+"</td><td class='r'>"+(c.noCov?"-":(dC?Math.round(dd/dC*100)+"%":"-"))+"</td><td class='r'>"+c.nP+" → "+c.nC+"</td><td class='r'>"+c.lost+"</td><td class='r'>"+c.neu+"</td></tr>";
    if(c.noCov) h+="<tr><td style='padding-left:28px;color:var(--sub)'>└ うち前期データが揃っている先のみ</td><td class='r'>"+mu(c.cp)+"</td><td class='r'>"+mu(c.cc)+"</td><td class='r "+cls(dd)+"'>"+mu(dd)+"</td><td class='r'>"+pct(c.cp?c.cc/c.cp:null)+"</td><td class='r'>"+(dC?Math.round(dd/dC*100)+"%":"-")+"</td><td colspan='3'></td></tr>"; }
  h+="<tr class='tot'><td>合計（比較可能な先のみ）</td><td class='r'>"+mu(T.cp)+"</td><td class='r'>"+mu(T.cc)+"</td><td class='r "+cls(dC)+"'>"+mu(dC)+"</td><td class='r'>"+pct(T.cp?T.cc/T.cp:null)+"</td><td class='r'>100%</td><td colspan='3'></td></tr>";
  h+="<tr class='tot'><td>合計（全部）</td><td class='r'>"+mu(T.p)+"</td><td class='r'>"+mu(T.c)+"</td><td class='r "+cls(dT)+"'>"+mu(dT)+"</td><td class='r'>"+pct(T.p?T.c/T.p:null)+"</td><td class='r'>-</td><td colspan='3'></td></tr>";
  $("chTable").innerHTML=h;
}
function tag(ch){ const m={"市売":"t-ichi","付売":"t-tsuke","EC":"t-ec","HP直販":"t-hp"}; return "<span class='tag "+(m[ch]||"")+"'>"+esc(ch)+"</span>"; }
function renderChips(){
  const defs=[["all","すべて"],["down","減った先"],["up","増えた先"],["lost","消えた先（前期あり→今期ゼロ）"],["new","新規（前期ゼロ→今期あり）"],["memo","メモあり（要フォロー・販促余地など）"]];
  const chs=[["all","全チャネル"],["市売","市売"],["付売","付売"],["EC","EC"],["HP直販","HP直販"]];
  $("chips").innerHTML=defs.map(([k,l])=>"<button class='chip"+(FILTER===k?" on":"")+"' data-f='"+k+"'>"+l+"</button>").join("")+"<span style='width:14px'></span>"+chs.map(([k,l])=>"<button class='chip"+(CH===k?" on":"")+"' data-c='"+k+"'>"+l+"</button>").join("");
  $("chips").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{FILTER=b.dataset.f; renderChips(); renderTable();});
  $("chips").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{CH=b.dataset.c; renderChips(); renderTable();});
}
function renderTable(){
  const T=RES.tot; const dT=T.c-T.p; const q=Q.trim();
  let rows=RES.rows.filter(o=>{
    if(CH!=="all"&&o.ch!==CH) return false;
    if(q&&o.name.indexOf(q)<0) return false;
    if(FILTER==="down") return o.d<0; if(FILTER==="up") return o.d>0; if(FILTER==="lost") return !o.indiv&&o.p&&!o.c; if(FILTER==="new") return o.isNew; if(FILTER==="memo") return !!o.memo;
    return true;
  });
  rows.sort((a,b)=>{ const k=SORT.k; let va=a[k],vb=b[k]; if(k==="name"||k==="ch"){ va=String(va);vb=String(vb); return SORT.asc?va.localeCompare(vb,"ja"):vb.localeCompare(va,"ja"); } if(k==="last"){ va=va?va.getTime():0; vb=vb?vb.getTime():0; } if(va==null) va=-Infinity; if(vb==null) vb=-Infinity; return SORT.asc?va-vb:vb-va; });
  const maxAbs=Math.max(1,...rows.map(o=>Math.abs(o.d)));
  const th=(k,l,r)=>"<th class='"+(r?"r":"")+"' data-k='"+k+"'>"+l+(SORT.k===k?(SORT.asc?" ▲":" ▼"):"")+"</th>";
  let h="<tr>"+th("name","取引先")+th("ch","区分")+th("p","前期",1)+th("c","今期",1)+th("d","差",1)+"<th></th>"+th("rate","前年比",1)+"<th class='r'>全体の差への寄与</th>"+th("last","最終取引",1)+"<th>前期データ</th><th>メモ</th></tr>";
  let sp=0,sc=0;
  for(const o of rows){ sp+=o.p; sc+=o.c;
    const w=Math.round(Math.abs(o.d)/maxAbs*90); const bar="<span class='bar' style='width:"+w+"px;background:"+(o.d<0?"#fca5a5":"#86efac")+"'></span>";
    const cov=o.cov==="ok"?"":(o.cov==="part"?"<span class='tag t-warn'>前期一部のみ</span>":"<span class='tag t-red'>前期データなし</span>");
    let st=o.indiv?" <span class='tag t-gray'>"+(o.name===INDIV_CO?"単発の法人をまとめて表示":"個人名をまとめて表示")+"</span>":((o.p&&!o.c)?" <span class='tag t-red'>消えた</span>":(o.isNew?" <span class='tag t-green'>新規</span>":((!o.p&&o.c&&o.first)?" <span class='tag t-gray' title='比較期間の外（前々期以前、または前期の終了月より後）に取引あり。前期の同期間はゼロ'>戻り</span>":"")));
    if(o.memo) st+=" <span class='tag t-"+(o.memo.kind||"gray")+"'>"+esc(o.memo.st)+"</span>";
    const memo=o.memo?"<span style='color:var(--sub);font-size:12px'>"+esc(o.memo.note)+"</span>":"";
    const ttl=o.indiv?" title='"+esc(Object.entries(o.names).sort((a,b)=>b[1]-a[1]).slice(0,30).map(([n,v])=>n+" "+man1(v)+"万").join("\n"))+"'":"";
    h+="<tr"+ttl+"><td>"+esc(o.name)+st+"</td><td>"+tag(o.ch)+"</td><td class='r'>"+mu(o.p,1)+"</td><td class='r'>"+mu(o.c,1)+"</td><td class='r "+cls(o.d)+"' title='"+man1(o.d)+"万'>"+mu(o.d)+"</td><td>"+bar+"</td><td class='r'>"+pct(o.rate)+"</td><td class='r'>"+(dT?Math.round(o.d/dT*100)+"%":"-")+"</td><td class='r'>"+ymd(o.last)+"</td><td>"+cov+"</td><td style='max-width:320px;white-space:normal'>"+memo+"</td></tr>";
  }
  h+="<tr class='tot'><td colspan='2'>表示分の合計（"+rows.length+"件）</td><td class='r'>"+mu(sp)+"</td><td class='r'>"+mu(sc)+"</td><td class='r "+cls(sc-sp)+"'>"+mu(sc-sp)+"</td><td></td><td class='r'>"+pct(sp?sc/sp:null)+"</td><td class='r'>"+(dT?Math.round((sc-sp)/dT*100)+"%":"-")+"</td><td colspan='3'></td></tr>";
  $("tbl").innerHTML=h;
  $("tbl").querySelectorAll("th[data-k]").forEach(t=>t.onclick=()=>{ const k=t.dataset.k; if(SORT.k===k) SORT.asc=!SORT.asc; else { SORT.k=k; SORT.asc=(k==="d"||k==="name"||k==="ch"); } renderTable(); });
  $("listSub").textContent="単位：万円。差の小さい順（減少が大きい先が上）。列名クリックで並べ替え。";
}
$("q").oninput=e=>{ Q=e.target.value; renderTable(); };
function renderNotes(){
  const R=RES.R; const ich=RES.rows.filter(o=>o.ch==="市売"); const noCov=ich.filter(o=>o.cov!=="ok").map(o=>o.name);
  const yo=RES.rows.find(o=>o.name==="ヤフーショッピング");
  const lines=[
    "<b>市売</b>は市場別精算台帳（精算書の税抜売上）です。精算書の取り込みは市場によって開始時期が違うため、前期の途中から記録が始まっている市場は「前期一部のみ」「前期データなし」と表示しています"+(noCov.length?"（該当: "+esc(noCov.join("・"))+"）":"")+"。その市場の前年比は実態より良く見えます。",
    "<b>付売・HP直販</b>は納品書DB（出荷日ベース・税抜）です。会計の売上（入金時計上）とは月がずれます。<b>個人名の客は「個人客（単発）」、HP直販の法人で注文日が3日未満の先は「単発法人（HP直販）」に1行でまとめ</b>、取引先数・消えた・新規には数えていません（行にマウスを乗せると内訳が出ます）。会社名の判定は名前の語（木材・建設・（株）など）で行っています。",
    "<b>EC</b>は楽天・ヤフーの売上集計表の月合計（受注ベース・クーポン調整後）です。"+(yo&&yo.p===0?"ヤフーの前期はまだ集計表に入っていません。":""),
    "<b>会計の売上高と合計は一致しません</b>。会計は入金ベースで、税理士の月次計上と戻入が入ります。全社の前年比は決算書（貸借対照表・損益計算書）を正としてください。このツールは「どの取引先で増減したか」を見るためのものです。",
    "<b>名寄せ・メモ</b>: 表記ゆれは同一先にまとめています（"+esc(Object.entries(YOY.alias()).map(([a,b])=>a+"＝"+b).join("・"))+"）。取引先メモ（廃業・自社品へ切替・要フォロー・販促余地）は林大樹さんの判断を手入力したもので、「メモあり」チップで絞り込めます。追加・修正はClaudeに伝えてください。",
    "終了月は右上で変えられます。当月は締まっていないので、既定は前月までです。"
  ];
  $("notes").innerHTML="<ul style='margin:0;padding-left:18px'>"+lines.map(l=>"<li>"+l+"</li>").join("")+"</ul>";
}
boot();
</script>
</body>
